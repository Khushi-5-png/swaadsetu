<div class="ai-chef-page">

  <h1>🤖 AI Chef</h1>

  <p>Your smart cooking assistant</p>

  <div class="chat-box">

    <div class="messages">

      @for (message of messages; track $index) {

        <div
          class="chat-message"
          [class.user-message]="message.sender === 'user'"
          [class.ai-message]="message.sender === 'ai'"
        >

          <strong>
            {{ message.sender === 'user' ? 'You' : 'AI Chef' }}:
          </strong>

          <p>{{ message.text }}</p>

        </div>

      }

      @if (loading) {

        <div class="chat-message ai-message">
          <strong>AI Chef:</strong>
          <p>Thinking... 🤔</p>
        </div>

      }

    </div>

    <div class="chat-input">

      <input
        type="text"
        [(ngModel)]="userMessage"
        (keyup.enter)="sendMessage()"
        placeholder="Ask AI Chef anything..."
        [disabled]="loading"
      />

      <button
        (click)="sendMessage()"
        [disabled]="loading || !userMessage.trim()"
      >
        {{ loading ? 'Thinking...' : 'Send' }}
      </button>

    </div>

  </div>

</div>
